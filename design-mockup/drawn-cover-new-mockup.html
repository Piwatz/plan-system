<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<title>ปกที่ระบบวาดแบบใหม่</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* สีชนิดงาน (จะเป็นตัวแปรใน themes.js ของธีม I) */
:root { --bg:#EEF2F7; --ink:#0F1E33; --muted:#4E5F78; --accent:#E3A21A;
  --cv-plan:#1D3A66; --cv-guide:#17694F; --cv-note:#8E1B2C; }
body { margin:0; background:var(--bg); font-family:'Noto Sans Thai Looped',sans-serif; color:var(--ink); padding:24px 28px 32px; width:1180px; }
h1 { font-size:22px; margin:0 0 4px; } p.sub { margin:0 0 18px; color:var(--muted); font-size:15px; }
.row { display:flex; align-items:flex-start; gap:22px; margin-bottom:26px; }
.lab { width:150px; flex:none; padding-top:6px; }
.lab b { display:block; font-size:28px; } .lab span { font-size:14px; color:var(--muted); line-height:1.4; display:block; }
.cv { width:300px; aspect-ratio:210/297; position:relative; overflow:hidden; border-radius:4px; box-shadow:2px 3px 8px rgba(15,30,51,.22);
  font-family:'Sarabun',sans-serif; display:flex; flex-direction:column; align-items:center; text-align:center; line-height:1.35; }
.cv .logo { width:62px; }
.plan { --c:var(--cv-plan); } .guide { --c:var(--cv-guide); } .note { --c:var(--cv-note); }
.kind { font-weight:700; } .code { font-size:15px; } .name { font-weight:700; } .info { font-size:13px; } .tch { font-size:14px; }
.school { font-size:12.5px; font-weight:600; }
/* ก หัวกระดาษขาว แถบสีชนิดงาน */
.A { background:#fff; }
.A .head { width:100%; padding:16px 0 10px; display:flex; flex-direction:column; align-items:center; gap:4px; }
.A .band { width:100%; background:var(--c); color:#fff; padding:14px 18px 16px; }
.A .band .kind { font-size:22px; } .A .band .bar { width:70px; height:3px; background:var(--accent); margin:8px auto 0; border-radius:2px; }
.A .body { flex:1; display:flex; flex-direction:column; justify-content:center; gap:6px; padding:0 20px; color:var(--ink); }
.A .body .name { font-size:20px; color:var(--c); }
.A .foot { width:100%; height:12px; background:var(--c); }
/* ข พื้นสีเต็ม ตราในวงขาว */
.B { background:var(--c); color:#fff; padding:20px 20px 0; box-sizing:border-box; }
.B .disc { width:86px; height:86px; border-radius:50%; background:#fff; display:grid; place-items:center; }
.B .disc .logo { width:52px; }
.B .school { margin-top:8px; opacity:.9; }
.B .kind { font-size:23px; margin-top:22px; } .B .bar { width:60px; height:3px; background:var(--accent); margin:10px 0 14px; border-radius:2px; }
.B .name { font-size:20px; } .B .mid { display:flex; flex-direction:column; gap:5px; align-items:center; }
.B .bottom { margin-top:auto; width:calc(100% + 40px); background:rgba(0,0,0,.18); padding:12px 0 14px; display:flex; flex-direction:column; gap:3px; }
/* ง แบบ ข ตราพื้นใสบนสีปก */
.D .logo { width:78px; } .D .school { margin-top:10px; }
/* ค กรอบเส้นคู่แบบเอกสารราชการ พื้นขาว */
.C { background:#fff; padding:12px; box-sizing:border-box; }
.C .frame { flex:1; width:100%; border:3px double var(--c); outline:1px solid var(--c); outline-offset:3px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; padding:16px 14px 14px; }
.C .logo { width:66px; } .C .school { margin-top:6px; color:var(--ink); }
.C .kind { margin-top:24px; font-size:21px; color:#fff; background:var(--c); padding:4px 20px; border-radius:30px; }
.C .mid { margin-top:22px; display:flex; flex-direction:column; gap:6px; color:var(--ink); }
.C .name { font-size:20px; color:var(--c); }
.C .bottom { margin-top:auto; color:var(--ink); display:flex; flex-direction:column; gap:3px; }
.C .line { width:50%; height:2px; background:var(--accent); margin:0 auto 8px; }
</style></head><body>
<h1>ปกที่ระบบวาดแบบใหม่ 4 แบบ ผู้ดูแลระบบเลือกได้ ค่าเริ่มต้น แบบ ง (ข้อมูลสมมติ)</h1>

const T = {
  A: k => `<div class="head">${logo}${school}</div><div class="band"><div class="kind">${k}</div><div class="bar"></div></div>
    <div class="body"><span class="code">รหัสวิชา ${d.code}</span><span class="name">${d.name}</span><span class="info">${d.grade}</span><span class="info">${d.term}</span><span class="tch" style="margin-top:10px">ครูผู้สอน ${d.tch}</span></div><div class="foot"></div>`,
  B: k => `<div class="disc">${logo}</div>${school}<div class="kind">${k}</div><div class="bar"></div>
    <div class="mid"><span class="code">รหัสวิชา ${d.code}</span><span class="name">${d.name}</span><span class="info">${d.grade}</span></div>
    <div class="bottom"><span class="tch">ครูผู้สอน ${d.tch}</span><span class="info">${d.term}</span></div>`,
  D: k => T.B(k).replace('<div class="disc">'+logo+'</div>', logo),
  C: k => `<div class="frame">${logo}${school}<div class="kind">${k}</div>
    <div class="mid"><span class="code">รหัสวิชา ${d.code}</span><span class="name">${d.name}</span><span class="info">${d.grade}</span></div>
    <div class="bottom"><div class="line"></div><span class="tch">ครูผู้สอน ${d.tch}</span><span class="info">${d.term}</span></div></div>`
};
const desc = { A:'หัวกระดาษขาว ตรากลางบน แถบสีบอกชนิดงาน', B:'พื้นสีเต็มเหมือนปกเดิม ตราอยู่ในวงกลมขาว', D:'แบบ ข แต่ตราพื้นใสอยู่บนสีปกเลย (ค่าเริ่มต้น)', C:'พื้นขาว กรอบเส้นคู่ แบบเอกสารราชการ ประหยัดหมึกตอนพิมพ์' };

</script>
