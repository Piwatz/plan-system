<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>รายการธีมสี</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="/*FONTS*/" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 1740px; box-sizing: border-box; padding: 48px 40px; background: #FFFFFF; color: #1A1A1A; font-family: 'IBM Plex Sans Thai', sans-serif; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 36px; font-weight: 600; line-height: 1.3">รายการธีมสี</h1>
    <span style="font-size: 17px; color: #555555">10 ธีม แต่ละธีมมีสีพื้น สีหลัก สีรอง และตัวอักษรของตัวเอง ระบบจริงสลับธีมได้ภายหลัง</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{themes}}" as="th" hint-placeholder-count="8">
      <article style="background: {{th.bg}}; color: {{th.ink}}; border: 1px solid {{th.line}}; border-radius: {{th.r}}; padding: 22px; display: flex; flex-direction: column; gap: 14px; font-family: {{th.body}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 46px; height: 46px; flex: none; border-radius: 50%; background: {{th.primary}}; color: {{th.primaryInk}}; display: flex; align-items: center; justify-content: center; font: 600 21px/1 {{th.head}}">{{th.letter}}</span>
          <div style="display: flex; flex-direction: column; min-width: 0">
            <span style="font-family: {{th.head}}; font-weight: 600; font-size: 21px; line-height: 1.3">{{th.name}}</span>
            <span style="font-size: 13px; color: {{th.muted}}">{{th.fonts}}</span>
          </div>
        </div>
        <span style="font-size: 14px; line-height: 1.5; color: {{th.muted}}; min-height: 63px">{{th.desc}}</span>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{th.swatches}}" as="sw" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
              <span style="width: 100%; height: 38px; border-radius: 10px; background: {{sw.hex}}; border: 1px solid {{th.line}}"></span>
              <span style="font-size: 11px; color: {{th.muted}}">{{sw.label}}</span>
              <span style="font-size: 10px; color: {{th.muted}}; font-family: monospace">{{sw.hex}}</span>
            </div>
          </sc-for>
        </div>
        <div style="background: {{th.surface}}; border-radius: {{th.rs}}; box-shadow: {{th.shadow}}; padding: 14px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-weight: 600; font-size: 15px">ว30203 ฟิสิกส์เพิ่มเติม 3</span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <span style="background: {{th.okBg}}; color: {{th.ok}}; border-radius: 10px; padding: 6px 8px; font-size: 13px; font-weight: 600">ผ่านแล้ว</span>
            <span style="background: {{th.waitBg}}; color: {{th.wait}}; border-radius: 10px; padding: 6px 8px; font-size: 13px; font-weight: 600">รอตรวจ</span>
            <span style="background: {{th.backBg}}; color: {{th.back}}; border-radius: 10px; padding: 6px 8px; font-size: 13px; font-weight: 600">แก้ไข</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
            <button type="button" style="height: 44px; border: 0; border-radius: {{th.rs}}; background: {{th.soft}}; color: {{th.link}}; font: 600 14px/1 {{th.body}}">ให้ 5 ทุกข้อ</button>
            <button type="button" style="height: 44px; border: 0; border-radius: {{th.rs}}; background: {{th.primary}}; color: {{th.primaryInk}}; font: 600 14px/1 {{th.body}}">ลงนามเห็นชอบ</button>
          </div>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1740}}'>
/*THEMES*/

class Component extends DCLogic {
  renderVals() {
    const themes = Object.keys(THEMES).map((k) => {
      const t = themeOf(k);
      return Object.assign({}, t, {
        swatches: [
          { label: 'พื้น', hex: t.bg },
          { label: 'การ์ด', hex: t.surface },
          { label: 'ตัวอักษร', hex: t.ink },
          { label: 'สีหลัก', hex: t.primary },
          { label: 'สีรอง', hex: t.accent },
        ],
      });
    });
    return { themes };
  }
}
</script>
</body>
</html>
