<head>

<title>หน้าแรกครู</title>

</head>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: {{t.body}}; font-size: 16px; line-height: 1.5">

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 84px; overflow-y: auto; box-sizing: border-box; padding: 28px 20px 28px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 14px; color: {{t.muted}}">ภาคเรียนที่ 2/2569</span>
        <h1 style="margin: 0; font-family: {{t.head}}; font-weight: {{t.headWeight}}; font-size: 28px; line-height: 1.3">สวัสดี ครูสมชาย</h1>
      </div>
      <button type="button" aria-label="ข้อมูลของฉัน" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.link}}; font: 600 17px/1 {{t.body}}; cursor: pointer">สช</button>
    </div>

    <section style="background: {{t.surface}}; border-radius: {{t.r}}; box-shadow: {{t.shadow}}; padding: 18px 18px 8px; display: flex; flex-direction: column">
      <h2 style="margin: 0 0 6px; font-size: 17px; font-weight: 600">สิ่งที่ต้องทำต่อ</h2>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border: 0; border-top: 1px solid {{t.line}}; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer">

        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-weight: 600">คู่มือ ว30207 ถูกส่งกลับให้แก้ไข</span>
          <span style="font-size: 14px; color: {{t.muted}}">ฝ่ายวิชาการขอให้แก้ตารางน้ำหนักคะแนน หน้า 12</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border: 0; border-top: 1px solid {{t.line}}; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: {{t.wait}}; flex: none"></span>
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-weight: 600">บันทึกหลังแผน 2 ฉบับยังไม่ได้ส่ง</span>
          <span style="font-size: 14px; color: {{t.muted}}">วิชา ว30203 แผนที่ 4 และ 5 กดเพื่อส่งพร้อมกัน</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">

        <span style="font-size: 14px; color: {{t.muted}}">แตะช่องเพื่อส่งหรือดูงาน</span>
      </div>

        <article style="background: {{t.surface}}; border-radius: {{t.r}}; box-shadow: {{t.shadow}}; padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; flex-direction: column">
            <span style="font-weight: 600; font-size: 17px">{{s.code}} {{s.name}}</span>
            <span style="font-size: 14px; color: {{t.muted}}">{{s.grade}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{s.steps}}" as="st" hint-placeholder-count="3">
              <button type="button" onClick="{{st.go}}" style="min-height: 68px; border-radius: {{t.rs}}; border: 1px solid {{st.bd}}; background: {{st.bg}}; color: {{st.fg}}; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 2px; font: inherit; text-align: left; cursor: pointer">

                <span style="font-size: 15px; font-weight: 600; line-height: 1.3">{{st.status}}</span>
              </button>
            </sc-for>
          </div>
        </article>
      </sc-for>
    </section>

      หน้าแรก
    </button>
    <button type="button" style="position: relative; height: 60px; border: 0; background: none; color: {{t.muted}}; font: 500 13px/1.2 {{t.body}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"></path><path d="M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"></path></svg>
      รอตรวจ

    </button>
    <button type="button" onClick="{{openSubmit}}" aria-label="ส่งงานใหม่" style="height: 76px; border: 0; background: none; color: {{t.ink}}; font: 600 13px/1.2 {{t.body}}; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; cursor: pointer">

      </span>
      ส่งงาน
    </button>
    <button type="button" style="height: 60px; border: 0; background: none; color: {{t.muted}}; font: 500 13px/1.2 {{t.body}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">

            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">

        <sc-if value="{{isNote}}" hint-placeholder-val="{{ false }}">
          <div style="border-radius: {{t.r}}; background: {{t.bg}}; padding: 16px; display: flex; flex-direction: column; gap: 6px">
            <span style="font-weight: 600">แผนที่ 6 เรื่อง คลื่นนิ่ง</span>
            <span style="font-size: 14px; color: {{t.muted}}">ถัดไปจะเปิดช่องกรอก ด้านความรู้ ทักษะ คุณลักษณะ ปัญหาและข้อเสนอแนะ พิมพ์หรือพูดใส่ไมค์ได้</span>
          </div>
        </sc-if>

        <button type="button" style="height: 56px; border: 0; border-radius: {{t.rs}}; background: {{t.primary}}; color: {{t.primaryInk}}; font: 600 17px/1 {{t.body}}; cursor: pointer">{{sendLabel}}</button>
        <button type="button" style="height: 44px; border: 0; background: none; color: {{t.muted}}; font: 500 15px/1 {{t.body}}; cursor: pointer">เก็บไว้ก่อน ยังไม่ส่ง</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
