<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แนวสมุดและตรายาง หน้าแรกครู</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&amp;family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&amp;family=Sriracha&amp;family=Trirong:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes stPop{0%{transform:scale(2.4) rotate(-22deg);opacity:0}55%{transform:scale(.9) rotate(-8deg);opacity:1}75%{transform:scale(1.05) rotate(-8deg)}100%{transform:scale(1) rotate(-8deg);opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background-color: #FBF7EE; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, #E8E0CE 31px, #E8E0CE 32px); color: #2A2420; font-family: 'IBM Plex Sans Thai Looped', sans-serif; font-size: 16px; line-height: 1.5">
  <span style="position: absolute; top: 0; bottom: 0; left: 34px; width: 2px; background: #E9A9A4"></span>

  <div style="position: absolute; inset: 0 0 82px 0; overflow-y: auto; box-sizing: border-box; padding: 26px 18px 30px 50px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 0">
      <span style="font-family: 'Sriracha', cursive; font-size: 17px; color: #1F4E9A">ภาคเรียนที่ 2/2569</span>
      <h1 style="margin: 0; font-family: 'Trirong', serif; font-weight: 700; font-size: 29px; line-height: 1.3">สมุดงานของครูสมชาย</h1>
      <svg width="210" height="12" viewBox="0 0 210 12" aria-hidden="true"><path d="M2 8c20-6 34 4 52-1s30-5 48 0 32 4 52-1 34-3 54 1" fill="none" stroke="#B3261E" stroke-width="2.4" stroke-linecap="round"></path></svg>
    </div>

    <div style="align-self: flex-start; width: 290px; box-sizing: border-box; background: #FFE9A8; padding: 14px 16px; transform: rotate(-1.6deg); box-shadow: 0 6px 14px rgba(80, 60, 20, .16); font-family: 'Sriracha', cursive; font-size: 17px; line-height: 1.45; color: #3A2E1A">
      <div>อย่าลืม</div>
      <div>1. คู่มือ ว30207 โดนส่งกลับ แก้ตารางคะแนนหน้า 12</div>
      <div>2. บันทึกหลังแผน ว30203 ยังไม่ส่ง 2 ฉบับ</div>
    </div>

    <sc-for list="{{subjects}}" as="s" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column">
        <span style="align-self: flex-start; padding: 6px 16px 4px; border-radius: 12px 12px 0 0; background: #EBCB8B; font-family: 'Trirong', serif; font-weight: 700; font-size: 17px">{{s.code}}</span>
        <div style="background: #FFFFFF; border: 1px solid #E3D7BF; border-radius: 0 14px 14px 14px; box-shadow: 0 3px 0 #EBCB8B; padding: 12px 14px 6px; display: flex; flex-direction: column">
          <span style="font-weight: 600; font-size: 16px; padding-bottom: 6px">{{s.name}}</span>
          <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
            <div style="min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px dashed #E3D7BF">
              <span style="font-size: 15px">{{r.label}}</span>
              <sc-if value="{{r.isStamp}}" hint-placeholder-val="{{ true }}">
                <span style="display: inline-flex; align-items: center; padding: 3px 12px; border: 2.5px solid {{r.ink}}; border-radius: 8px; box-shadow: inset 0 0 0 2px #FFFFFF, inset 0 0 0 3.5px {{r.ink}}; color: {{r.ink}}; font-family: 'Chonburi', serif; font-size: 16px; transform: rotate(-8deg); opacity: .92; animation: {{r.anim}}">{{r.stamp}}</span>
              </sc-if>
              <sc-if value="{{r.isSend}}" hint-placeholder-val="{{ false }}">
                <button type="button" onClick="{{r.send}}" style="height: 44px; padding: 0 14px; border: 2px dashed #1F4E9A; border-radius: 12px; background: #F2F6FD; color: #1F4E9A; display: flex; align-items: center; gap: 6px; font: 600 15px/1 'IBM Plex Sans Thai Looped', sans-serif; cursor: pointer">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
                  ส่งเลย
                </button>
              </sc-if>
              <sc-if value="{{r.isText}}" hint-placeholder-val="{{ false }}">
                <span style="font-family: 'Sriracha', cursive; font-size: 18px; color: #1F4E9A">{{r.text}}</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="เมนูหลัก" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; box-sizing: border-box; padding: 0 12px 12px; background: #F3EBDA; border-top: 2px solid #E3D7BF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; align-items: end">
    <button type="button" style="height: 62px; border: 0; border-radius: 0 0 14px 14px; background: #EBCB8B; color: #2A2420; font: 600 14px/1.2 'IBM Plex Sans Thai Looped', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; box-shadow: 0 -3px 0 #2A2420 inset">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"></path><path d="M8 9h8M8 13h6"></path></svg>
      สมุดงาน
    </button>
    <button type="button" style="height: 62px; border: 0; background: none; color: #5B5148; font: 500 14px/1.2 'IBM Plex Sans Thai Looped', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      ส่งงาน
    </button>
    <button type="button" style="height: 62px; border: 0; background: none; color: #5B5148; font: 500 14px/1.2 'IBM Plex Sans Thai Looped', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"></path><path d="M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"></path></svg>
      รอตรวจ
    </button>
    <button type="button" style="height: 62px; border: 0; background: none; color: #5B5148; font: 500 14px/1.2 'IBM Plex Sans Thai Looped', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      ฉัน
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const RED = '#B3261E';
const BLUE = '#1F4E9A';
const GREEN = '#2F6B3F';
const SUBJECTS = [
  { code: 'ว30203', name: 'ฟิสิกส์เพิ่มเติม 3', rows: [['m', 'คู่มือรายวิชา', 'stamp', 'อนุญาต', RED], ['p', 'แผนการสอน', 'stamp', 'รอ ผอ.', BLUE], ['n', 'บันทึกหลังแผน', 'text', '5 ฉบับ']] },
  { code: 'ว30207', name: 'ฟิสิกส์ 1', rows: [['m', 'คู่มือรายวิชา', 'stamp', 'แก้ไข', RED], ['p', 'แผนการสอน', 'send']] },
  { code: 'ว22201', name: 'โครงงานวิทยาศาสตร์ 1', rows: [['m', 'คู่มือรายวิชา', 'send'], ['p', 'แผนการสอน', 'send']] },
];

class Component extends DCLogic {
  renderVals() {
    const sent = (this.state && this.state.sent) || {};
    const subjects = SUBJECTS.map((s) => ({
      code: s.code,
      name: s.name,
      rows: s.rows.map(([key, label, kind, value, ink]) => {
        const id = s.code + key;
        if (kind === 'send' && sent[id]) {
          return { label, isStamp: true, isSend: false, isText: false, stamp: 'ส่งแล้ว', ink: GREEN, anim: 'stPop .55s ease-out both' };
        }
        return {
          label,
          isStamp: kind === 'stamp',
          isSend: kind === 'send',
          isText: kind === 'text',
          stamp: value,
          text: value,
          ink: ink || BLUE,
          anim: 'none',
          send: () => this.setState({ sent: Object.assign({}, sent, { [id]: true }) }),
        };
      }),
    }));
    return { subjects };
  }
}
</script>
</body>
</html>
